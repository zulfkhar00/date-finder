name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build (${{ matrix.observability }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # "off": no Sentry/PostHog env (default deploy). "on": dummy public keys, so the enabled
        # code path is compiled too. No real secrets are used in CI.
        observability: [off, on]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: http://localhost:3000
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SECRET_KEY: dummy-ci-secret
      STRIPE_SECRET_KEY: sk_test_dummy_ci
      STRIPE_WEBHOOK_SECRET: whsec_dummy_ci
      NEXT_PUBLIC_SENTRY_DSN: ${{ matrix.observability == 'on' && 'https://0000000000000000000000000000000@o0.ingest.us.sentry.io/0' || '' }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ matrix.observability == 'on' && 'phc_dummy_ci_key' || '' }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check rendered guide routes
        shell: bash
        run: |
          server_log="$RUNNER_TEMP/guide-http.log"
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3417 > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then cat "$server_log" || true; fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$server_log"
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          ready=0
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Production server exited before guide checks"
              exit 1
            fi
            if curl --silent --fail --max-time 2 http://127.0.0.1:3417/guides > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Production server did not become ready"
            exit 1
          fi
          GUIDE_TEST_BASE_URL=http://127.0.0.1:3417 node --import tsx scripts/check-guides.ts
