name: Feature
description: A new capability or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why it matters now.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and what is explicitly out.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checkable acceptance test (what you can see in prod or in a PR).
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      description: Who builds it. Add the matching `agent:*` label.
      options:
        - miko-claude
        - zulya-codex
        - human
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Add the matching `area:*` label.
      options:
        - landing
        - admin
        - analytics
        - payments
        - infra
        - concierge
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      options:
        - label: No automation of any dating app (no logins, swiping, sending or scraping)
          required: true
        - label: Touches payments or schema? The PR will document a test-mode run or ship a new idempotent SQL file
